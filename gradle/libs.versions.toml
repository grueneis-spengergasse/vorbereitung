
[versions]
junitJupiterVersion = "6.1.3"
assertJVersion = "3.27.7"
jacksonVersion = "3.3.0"

[libraries]
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jacksonVersion" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
